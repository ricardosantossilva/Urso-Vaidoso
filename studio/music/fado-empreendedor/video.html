<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box} html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Inter",sans-serif}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#world{position:absolute;inset:0;transform-origin:540px 1200px}
.ch{position:absolute} .ch svg{width:100%;height:100%;overflow:visible}
#sub{position:absolute;left:40px;right:40px;top:190px;text-align:center;font-weight:800;font-size:64px;line-height:1.14;color:#fff;
  text-shadow:0 6px 0 #000,0 -4px 0 #000,5px 0 0 #000,-5px 0 0 #000,4px 4px 0 #000,-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000}
#sub .hl{color:#FFD45C}
#note{position:absolute;left:0;right:0;top:110px;text-align:center;font-size:56px}
#flashW{position:absolute;inset:0;background:#fff;opacity:0}
.card{position:absolute;background:#FBF5EA;border-radius:26px;box-shadow:0 24px 50px rgba(0,0,0,.4);overflow:hidden}
#endCard{position:absolute;left:0;right:0;text-align:center}
#endCard .wm{font-family:"Lora",serif;font-weight:700;font-size:120px}
#endCard .tg{font-family:"Lora",serif;font-style:italic;font-size:56px;margin-top:6px}
#endCard .url{display:inline-block;margin-top:24px;font-size:44px;font-weight:800;color:#fff;background:#0B2343;padding:14px 34px;border-radius:40px}
</style></head>
<body>
<div id="stage">
 <div id="world">
  <div class="layer" id="bg"></div>
  <div class="layer" id="back"></div>
  <div class="ch" id="girl"></div>
  <div class="ch" id="bear"></div>
  <div class="layer" id="props"></div>
 </div>
 <div id="flashW"></div>
 <div id="note"></div>
 <div id="sub"></div>
</div>
<script src="bear.js"></script><script src="girl.js"></script><script src="scenes.js"></script><script src="data.js"></script>
<script>
// data.js sets AL = align.json (duration, bpm, first_beat, lines[{text,start}])
const D = AL.duration;
const L = AL.lines.map(l => l.start);
// line index layout (see lyrics.txt): V1 0-7, C1 8-11, V2 12-19, C2 20-23, V3 24-31, C3 32-35, break, FC 36-39, outro 40
const TV = L[0];
const SEC = AL.sections; // [t0, kind, index]
const T_OUTRO = SEC.find(x => x[1] === 'outro')[0], T_END = AL.end;
const VS = SEC.filter(x => x[1] === 'verse').map(x => x[0]);
const SHOW = {};
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2 };
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) };
function hl(x) { return x.replace(/(Urso Vaidoso|empreendedor|CEO|faturação|fatura|primeiro euro|primeiro cliente|investidor|bom dia)/gi, '<span class="hl">$1</span>'); }
const card = (x, y, w, q, inner, rot = 0) => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;transform:scale(${q}) rotate(${rot}deg);padding:22px 30px;text-align:center">${inner}</div>`;
const RECEIPT = `<svg width="150" height="210" viewBox="0 0 150 210"><path d="M10 0 H140 V200 l-13 -10 l-13 10 l-13 -10 l-13 10 l-13 -10 l-13 10 l-13 -10 l-13 10 l-13 -10 l-12 10 Z" fill="#fff" stroke="#C9C2B4" stroke-width="3"/><rect x="28" y="22" width="94" height="12" rx="4" fill="#0B2343"/>${[50, 70, 90, 110].map(y => `<rect x="28" y="${y}" width="${60 + (y % 30)}" height="8" rx="3" fill="#9FB3C8"/>`).join('')}<text x="75" y="160" text-anchor="middle" font-family="Inter" font-weight="900" font-size="22" fill="#2FA36B">✔ OK</text></svg>`;
const up = (sh, el, inner) => `<g transform="rotate(${-(sh + el)})">${inner}</g>`;
// sections
function section(t) {
  if (t >= T_END) return { k: 'end', t0: T_END };
  let cur = SEC[0];
  for (const x of SEC) if (t >= x[0]) cur = x;
  return { k: cur[1], i: cur[2], t0: cur[0] };
}
function bgFor(s) {
  if (s.k === 'intro') return 'garagem';
  if (s.k === 'verse') return ['garagem', 'sala', 'pitch'][s.i];
  if (s.k === 'chorus') return s.i >= 3 ? 'aurora' : 'barco';
  if (s.k === 'break') return s.i >= 1 ? 'aurora' : 'barco';
  return 'aurora';
}
// verse cards: [line index where it appears, html]
const CARDS = [
  [2, `<div style="font-weight:800;font-size:42px;color:#5A6B80">Portátil ✔ Logótipo ✔</div><div style="font-weight:900;font-size:96px;color:#0A1F3C;line-height:1.05">Agora<br>sou CEO 😎</div>`],
  [4, `<div style="font-weight:800;font-size:44px;color:#5A6B80">A mãe:</div><div style="font-weight:900;font-size:66px;color:#0A1F3C;line-height:1.08">"Mas isso<br>dá dinheiro?" 🤔</div>`],
  [6, `<div style="font-weight:800;font-size:42px;color:#5A6B80">Seis meses depois...</div><div style="font-weight:900;font-size:70px;color:#0A1F3C;line-height:1.05">📞 o banco<br>liga primeiro</div>`],
  [12, `<div style="font-weight:900;font-size:58px;color:#0A1F3C;line-height:1.2">👩‍💼 Diretora<br>🧑‍🎓 Estagiária<br>🧹 Limpeza</div>`],
  [14, `<div style="font-weight:800;font-size:42px;color:#5A6B80">Emails às</div><div style="font-weight:900;font-size:110px;color:#7A2E3A;line-height:1">03:00 📧</div>`],
  [16, `<div style="font-weight:900;font-size:60px;color:#0A1F3C;line-height:1.15">Em cima: casaco 👔<br>Em baixo: pantufas 🩴</div>`],
  [18, `<div style="font-weight:900;font-size:66px;color:#0A1F3C;line-height:1.08">⏰ O despertador<br>desistiu</div>`],
  [24, `<div style="font-weight:800;font-size:42px;color:#5A6B80">O gráfico do pitch</div><div style="font-weight:900;font-size:76px;color:#2E9E5B;line-height:1.05">📈 até ao céu</div>`],
  [26, `<div style="font-weight:800;font-size:44px;color:#5A6B80">O investidor:</div><div style="font-weight:900;font-size:72px;color:#0A1F3C;line-height:1.05">"E o lucro?" 🎩💨</div>`],
  [28, `<div style="font-weight:800;font-size:42px;color:#5A6B80">Um dia...</div><div style="font-weight:900;font-size:66px;color:#0A1F3C;line-height:1.08">o 1.º cliente<br>pagou! 🎉🐈</div>`],
  [30, `<div style="font-weight:800;font-size:42px;color:#5A6B80">Fatura n.º 1</div><div style="font-weight:900;font-size:66px;color:#0A1F3C;line-height:1.08">🖼️ emoldurada<br>na parede</div>`],
];
const CARD_IDX = CARDS.map(c => c[0]);
const cardEnd = i => { const nc = CARD_IDX.find(k => k > i); const ns = SEC.map(x => x[0]).find(x => x > L[i] + 0.01); return Math.min(L[i] + 7.5, nc !== undefined ? L[nc] : 1e9, ns !== undefined ? ns : 1e9); };

function render(t) {
  const bpm = AL.bpm, B0 = AL.first_beat, tb = Math.max(0, t - B0), ph = tb * bpm / 60 * Math.PI * 2, beat = Math.floor(tb * bpm / 60);
  const BEAT = 60 / bpm;
  const S = section(t), w = bgFor(S);
  $('bg').innerHTML = ({ garagem: garagemSVG, sala: salaSVG, pitch: pitchSVG, barco: barcoSVG, aurora: auroraSVG })[w](t);
  let white = 0;SEC.slice(2).map(x => x[0]).forEach(tc => { const d = t - tc; if (d > -0.08 && d < 0.25) white = Math.max(white, 1 - Math.abs(d - 0.02) / 0.24); });
  const A = { hang: { sh: 12, el: 8 }, hip: { sh: 38, el: -105 }, up: { sh: 145, el: 8 }, frame: { sh: 125, el: -115 },
    out: { sh: 85, el: 0 }, low: { sh: 40, el: 10 }, hold: { sh: -55, el: -25 } };
  const mir = p => ({ sh: -p.sh, el: -p.el });
  const VERSE = [[A.hip, mir(A.hip), 0, 0, 0], [A.hip, mir(A.up), -4, 18, 0], [A.frame, mir(A.frame), 0, 0, 0], [A.up, mir(A.hip), 4, -18, 0]];
  const CHORUS = [[A.hip, 'in', -3, 0, 1], [A.up, 'in', -6, 0, 1], [A.frame, mir(A.frame), 0, 0, 0], [A.out, 'in', 3, 0, 1]];
  const BREAK = [[A.up, mir(A.up), 0, 0, 0], [A.out, mir(A.out), -6, 30, 1], [A.up, mir(A.hip), 5, -30, 0], [A.frame, mir(A.frame), 0, 0, 1], [A.low, mir(A.up), -5, 30, 0], [A.hip, mir(A.hip), 0, 0, 0]];
  const lerp = (a, b, f) => a + (b - a) * f;
  const lerpArm = (p, q, f) => ({ sh: lerp(p.sh, q.sh, f), el: lerp(p.el, q.el, f) });
  function routine(list, t0, isGirl, steps = 2) {
    const k = Math.max(0, (t - t0) / (steps * BEAT)), i = Math.floor(k), fr = (k - i) * steps * BEAT;
    const cur = list[i % list.length], prev = list[(i + list.length - 1) % list.length];
    const f = i === 0 && t < t0 + 0.12 ? ease((t - t0) / 0.12) : ease(fr / 0.12);
    const arms = st => { let a = st[0], b = st[1]; if (b === 'in') b = mir(A.hold); return isGirl ? { L: mir(b), R: mir(a) } : { L: a, R: b }; };
    const ap = arms(prev), ac = arms(cur), dir = isGirl ? -1 : 1;
    return { armL: lerpArm(ap.L, ac.L, f), armR: lerpArm(ap.R, ac.R, f), lean: lerp(prev[2], cur[2], f) * dir, dx: lerp(prev[3], cur[3], f) * dir, look: lerp(prev[4], cur[4], f) * 0.6 * dir };
  }
  const big = S.k === 'chorus' || S.k === 'break';
  let ob, og, bx = 30, gx = 560, jump = 0;
  const pulse = 1 + 0.025 * Math.max(0, Math.cos(((tb * bpm / 60) % 1) * Math.PI));
  const sing = (a) => 0.15 + Math.max(0, Math.sin(t * 20 + a)) * 0.5;
  if (S.k === 'intro') {
    ob = { eyes: 'open', look: 0, brow: -6, lean: 0, squash: 1, armL: A.hip, armR: { sh: -120, el: -95 }, monocle: true, mouth: 0.12, twirl: Math.sin(t * 5) * 8 };
    og = { eyes: t > TV * 0.6 ? 'wink' : 'open', look: 0, brow: 6, lean: 0, squash: 1, armL: { sh: 12, el: 8 }, armR: mir(A.hip), mouth: 0.12 };
  } else if (S.k === 'verse') {
    const rb = routine(VERSE, S.t0, false), rg = routine(VERSE, S.t0, true);
    ob = { eyes: 'open', look: rb.look, brow: -6, lean: rb.lean, squash: pulse, armL: rb.armL, armR: rb.armR, monocle: true, mouth: 0.15 };
    og = { eyes: 'open', look: rg.look, brow: 6, lean: rg.lean, squash: pulse, armL: rg.armL, armR: rg.armR, mouth: sing(0) };
    bx += rb.dx; gx += rg.dx;
  } else if (S.k === 'chorus' || S.k === 'break') {
    const isB = S.k === 'break';
    const rb = routine(isB ? BREAK : CHORUS, S.t0, false, isB ? 1 : 2), rg = routine(isB ? BREAK : CHORUS, S.t0, true, isB ? 1 : 2);
    const m = ease((t - S.t0) / 0.5);
    bx = 30 + 95 * m + (isB ? rb.dx : 0); gx = 560 - 95 * m + (isB ? rg.dx : 0);
    if (isB) jump = Math.max(0, Math.sin(ph)) * 26;
    ob = { eyes: rb.look > .2 ? 'smug' : 'open', look: rb.look, brow: -6, lean: rb.lean, squash: pulse, armL: rb.armL, armR: rb.armR, monocle: true, mouth: isB ? 0.35 : 0.15 };
    og = { eyes: rg.look < -.2 ? 'smug' : 'open', look: rg.look, brow: 6, lean: rg.lean, squash: pulse, armL: rg.armL, armR: rg.armR, mouth: isB ? 0.35 : sing(1) };
  } else {
    const m = ease((t - T_OUTRO) / 0.5); bx = 125 - 95 * m; gx = 465 + 95 * m;
    ob = { eyes: t > T_OUTRO + 2 ? 'wink' : 'open', look: 0, brow: -6, lean: 0, squash: 1, armL: A.hip, armR: mir(A.hip), monocle: true, mouth: 0.12 };
    og = { eyes: 'open', look: 0, brow: 6, lean: 0, squash: 1, armL: A.hip, armR: { sh: -150, el: -10 }, mouth: t < T_END - 0.5 ? sing(2) : 0.15 };
  }
  if (S.k === 'verse') ob.propR = up(ob.armR.sh, ob.armR.el, `<g transform="translate(-75 -230)">${RECEIPT}</g>`);
  ob.blink = ob.eyes === 'open' && (t % 3.3) < 0.11; og.blink = og.eyes === 'open' && ((t + 1.4) % 3.7) < 0.11;
  // a turn together on the last beat of each chorus, and every 8 beats in the dance break
  let turnF = 1;
  SEC.forEach((x, n) => { const te = x[0]; if (n > 0 && SEC[n - 1][1] === 'chorus' && t >= te - BEAT && t < te) turnF = Math.cos(((t - (te - BEAT)) / BEAT) * Math.PI * 2); });
  if (S.k === 'break') { const k = (t - S.t0) / BEAT; if (k % 8 > 7) turnF = Math.cos((k % 1) * Math.PI * 2); }
  const B = $('bear'), G = $('girl');
  B.style.left = bx + 'px'; B.style.top = (1000 - jump) + 'px'; B.style.width = '500px'; B.style.height = '833px'; B.style.transform = `scaleX(${turnF})`;
  G.style.left = gx + 'px'; G.style.top = (1060 - jump) + 'px'; G.style.width = '460px'; G.style.height = '767px'; G.style.transform = `scaleX(${turnF})`;
  B.innerHTML = bearSVG(ob); G.innerHTML = girlSVG(og);
  // troupe of girl bears in every chorus and the dance break
  let troupe = '';
  if (big) {
    const dresses = [['#E2365B', '#B32848'], ['#F2B705', '#C99300'], ['#9B59D0', '#7A3FAE'], ['#D9DDE3', '#AEB4BC'], ['#F07B2E', '#C85F1C'], ['#2E6DB4', '#1F4F86']];
    const slots = [[0, 760], [1, 800], [2, 840], [3, 840], [4, 800], [5, 760]].map(([i, top]) => [60 + i * 160, top]);
    slots.forEach(([x, top], k) => {
      const r = routine(S.k === 'break' ? BREAK : VERSE, S.t0, k >= 3, S.k === 'break' ? 1 : 2);
      const d = dresses[k % 6];
      const sv = girlSVG({ eyes: 'open', look: 0, brow: 6, mouth: 0.15 + (S.k === 'chorus' ? Math.max(0, Math.sin(t * 20 + k)) * 0.4 : 0.2), lean: r.lean, squash: pulse, armL: r.armL, armR: r.armR })
        .split('#1F7A6E').join(d[0]).split('#165C53').join(d[1]);
      const enter = back((t - S.t0 - 0.06 * Math.abs(k - 2.5)) / 0.45);
      troupe += `<div class="ch" style="left:${x + r.dx * 0.5}px;top:${top + (1 - enter) * 400 - jump * 0.6}px;width:180px;height:300px;opacity:${clamp(enter)}">${sv}</div>`;
    });
  }
  $('back').innerHTML = troupe;
  let props = '';
  // hook card in the intro and the first two lines
  if (t < L[2]) {
    const q = back(t / .35);
    props += `<div class="card" style="left:110px;top:430px;width:860px;transform:scale(${q}) rotate(-2deg)"><div style="background:#C8202C;color:#fff;font-weight:900;font-size:44px;letter-spacing:.14em;text-align:center;padding:14px 0">UM FADO DO URSO 🐻🎸</div><div style="padding:24px 30px;text-align:center;font-weight:900;font-size:66px;color:#0A1F3C;line-height:1.1">A vida de<br><span style="color:#C8202C">empreendedor</span></div></div>`;
  }
  if (S.k === 'verse') CARDS.forEach(([i, html], n) => { if (t >= L[i] && t < cardEnd(i)) props += card(150, 450, 780, back((t - L[i]) / .3), html, n % 2 ? 2 : -2); });
  if (S.k === 'chorus') {
    const pl = 1 + 0.06 * Math.abs(Math.sin(ph / 2)), q = back((t - S.t0) / .35) * pl;
    props += `<div style="position:absolute;left:290px;top:440px;width:500px;transform:scale(${q});background:#E2365B;border-radius:60px;box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center;padding:24px 0;font-weight:900;font-size:72px;color:#fff">+ Seguir</div>`;
    props += `<div style="position:absolute;left:0;right:0;top:600px;text-align:center"><span style="display:inline-block;background:rgba(11,35,67,.85);border-radius:30px;padding:8px 28px;font-weight:900;font-size:48px;color:#FFD45C">As contas? Urso Vaidoso 🐻</span></div>`;
    for (let i = 0; i < 6; i++) { const k = ((t - S.t0) * 0.7 + i / 6) % 1; props += `<div style="position:absolute;left:${80 + i * 160 + Math.sin(k * 7 + i) * 30}px;top:${1050 - k * 380}px;opacity:${1 - k};font-size:60px">${['🎵', '🧾', '🎶', '✨', '🎵', '🧾'][i]}</div>`; }
  }
  if (S.k === 'break') {
    const q = back((t - S.t0) / .4), bob = Math.sin(ph) * 8;
    props += `<div style="position:absolute;left:0;right:0;top:${330 + bob}px;text-align:center;transform:scale(${q})"><div style="display:inline-block;background:rgba(11,35,67,.85);border-radius:40px;padding:26px 46px"><div style="font-family:Lora,serif;font-weight:700;font-size:104px;color:#fff">Urso Vaidoso</div><div style="font-family:Lora,serif;font-style:italic;font-size:48px;color:#FFD45C">Vaidade é ter as contas em dia.</div></div></div>`;
    props += `<div style="position:absolute;left:0;right:0;top:660px;text-align:center;font-weight:900;font-size:58px;color:#fff;text-shadow:0 5px 0 #000">${['💃', '🕺'][beat % 2]} Dança, Urso! ${['🕺', '💃'][beat % 2]}</div>`;
  }
  if (S.k === 'outro') {
    props += card(150, 470, 780, back((t - T_OUTRO) / .3), `<div style="font-weight:900;font-size:60px;color:#0A1F3C">☀️ Bom dia, empreendedor!</div><div style="font-weight:800;font-size:42px;color:#5A6B80;margin-top:8px">Siga o Urso Vaidoso 👉</div><div style="margin:16px auto 0;width:420px;background:#E2365B;border-radius:50px;padding:14px 0;font-weight:900;font-size:58px;color:#fff">+ Seguir</div>`, -2);
    if (t >= T_OUTRO + 1.2) props += card(170, 800, 740, back((t - T_OUTRO - 1.2) / .3), `<div style="font-weight:800;font-size:40px;color:#5A6B80">Fale connosco</div><div style="font-weight:900;font-size:50px;color:#7A2E3A">hello@ursovaidoso.com</div>`, 2);
  }
  if (S.k === 'end') {
    const q = ease((t - T_END) / .5);
    props += `<div id="endCard" style="opacity:${q};transform:translateY(${(1 - q) * 40}px);top:420px"><div style="display:inline-block;background:rgba(11,35,67,.82);border-radius:40px;padding:40px 50px"><div class="wm" style="color:#fff">Urso Vaidoso</div><div class="tg" style="color:#FFD45C">Vaidade é ter as contas em dia.</div><div class="url" style="background:#E2365B">+ Seguir · 1 dica por dia</div><div style="margin-top:18px;font-size:44px;font-weight:800;color:#fff">hello@ursovaidoso.com</div><div style="margin-top:6px;font-size:38px;font-weight:700;color:#C9D6E6">ursovaidoso.com</div></div></div>`;
  }
  $('props').innerHTML = props;
  $('flashW').style.opacity = white * 0.85;
  // subtitles: each line until the next one, at most 5.5 s
  let sub = '';
  for (let i = 0; i < AL.lines.length; i++) { const a = L[i], b = Math.min(L[i + 1] !== undefined ? L[i + 1] : T_END, a + 5.5); if (t >= a - 0.05 && t < b) sub = SHOW[i] || AL.lines[i].text; }
  if (S.k === 'end' || S.k === 'break') sub = '';
  $('sub').innerHTML = hl(sub);
  $('note').innerHTML = (t >= TV && t < T_END) ? (beat % 2 ? '🎵' : '🎶') : '';
  const zoom = S.k === 'intro' ? 1 + 0.03 * ease(t / TV) : 1.03;
  $('world').style.transform = `scale(${zoom})`;
}
window.render = render; render(0);
</script></body></html>
